<!DOCTYPE html>
<html>
<head>
  <title>lab or lie?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-blob blob1"></div>
  <div class="background-blob blob2"></div>

  <main class="app">
    <p class="tag">medical lab game</p>
    <h1>lab or lie?</h1>
    <p class="subtitle">interpret the labs. diagnose the chaos.</p>

    <div class="quiz-settings">
      <p>choose mode</p>
      <button onclick="startQuiz(10)">10 cases</button>
      <button onclick="startQuiz(20)">20 cases</button>
      <button onclick="startInfinite()">∞ mode</button>
    </div> 
    
    <section class="card" id="gameCard" style="display: none;">
      
      <div class="top-row">
        <span id="difficulty">difficulty</span>
      </div>

      <pre id="labs"></pre>

      <div id="choices"></div>

      <p id="result"></p>

      <button class="next-btn" onclick="nextCase()">next case →</button>
    </section>

    <div class="score">
      <div>
        <span id="score">0</span>
        <p>score</p>
      </div>
      <div>
        <span id="streak">0</span>
        <p>streak</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
